[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rennervate"
version = "0.1.0"
description = "Chat with the Rennervate model family from your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BanZhuan.AI", email = "team@banzhuan.ai" }]
keywords = ["rennervate", "chat", "cli", "language-model"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "torch>=2.6,<3",
  "transformers>=5.22.1,<6",
  "accelerate>=1.10,<2",
  "huggingface-hub>=1.0,<2",
  "safetensors>=0.5",
  "psutil>=5.9",
]

[project.optional-dependencies]
compact = ["bitsandbytes>=0.48,<1"]
dev = ["pytest>=8", "build>=1.2", "twine>=6", "ruff>=0.9"]

[project.scripts]
rennervate = "rennervate.cli:main"

[project.urls]
Homepage = "https://github.com/banzhuan-ai/rennervate"
Models = "https://huggingface.co/BanZhuan-AI"
Issues = "https://github.com/banzhuan-ai/rennervate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rennervate"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
